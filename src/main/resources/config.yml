config-version: 0.2
debugMode: false
defaultMaxLevel: 100
defaultBaseExperienceRequirement: 10
defaultExperienceIncreaseFactor: 1.2
levelUpAlert: true
benefitAlert: true
skills:
  # Skill activation states - all skills default to active: true
  # Change to active: false to deactivate a skill
  Athlete:
    active: true
  Boating:
    active: true
  Breeding:
    active: true
  Cardio:
    active: true
  Crafting:
    active: true
  Digging:
    active: true
  Dueling:
    active: true
  Enchanting:
    active: true
  Farming:
    active: true
  Fishing:
    active: true
  Floriculture:
    active: true
  Gliding:
    active: true
  Hardiness:
    active: true
  Mining:
    active: true
  "Monster Hunting":
    active: true
  Pyromaniac:
    active: true
  Quarrying:
    active: true
  Riding:
    active: true
  Strength:
    active: true
  Lumberjack:
    active: true

# Per-skill benefit toggles. Set one to false to stop that skill's benefit
# from triggering while leaving its experience gain and levelling intact.
# (To stop both, deactivate the skill under "skills" above instead.)
# Any key missing from this file is treated as true.
athleteBenefitEnabled: true
boatingBenefitEnabled: true
breedingBenefitEnabled: true
cardioBenefitEnabled: true
craftingBenefitEnabled: true
diggingBenefitEnabled: true
duelingBenefitEnabled: true
enchantingBenefitEnabled: true
farmingBenefitEnabled: true
fishingBenefitEnabled: true
floricultureBenefitEnabled: true
glidingBenefitEnabled: true
hardinessBenefitEnabled: true
miningBenefitEnabled: true
monsterHuntingBenefitEnabled: true
pyromaniacBenefitEnabled: true
quarryingBenefitEnabled: true
ridingBenefitEnabled: true
strengthBenefitEnabled: true
lumberjackBenefitEnabled: true

# Usage reporting. When the plugin is enabled, and each time one of its
# commands is used, a small event (plugin name, event name, plugin version)
# is sent to the author's trace server so it is known which plugins are
# actually in use. Nothing about players or the server is included. Sending
# happens off the main thread, never blocks a tick, and is dropped silently
# if the server cannot be reached. Set enabled to false to turn it off.
# To turn it off for every plugin on this server that reports to trace, set
# enabled to false in plugins/trace/config.yml (created on the first start);
# or set the environment variable TRACE_USAGE_REPORTING=off (or DO_NOT_TRACK=1)
# for the server process. Details:
# https://github.com/Stephenson-Software/trace#usage-reporting
usage-reporting:
  enabled: true
  endpoint: https://trace.danielstephenson.dev
  # The key identifies this plugin to the trace server, so reports are
  # attributed to SimpleSkills and can be revoked as a group if they are ever
  # abused. It is not a secret -- it ships in this file on every server that
  # runs the plugin -- and it cannot do anything except report as this
  # plugin. Empty means reporting is off regardless of the switch above.
  key: "FBSl5wpkNnnjuoHKw5ULlw44etedGz-0XgW5XdOehXo"
